name: TRACEX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-audit-and-tests:
    name: Backend Forensic Verification & Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Utilities (libpcap/tcpdump)
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev tcpdump

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pip-audit

    - name: Dependency Security Audit (pip-audit)
      run: |
        pip-audit --desc on || echo "Audit completed with non-fatal advisory review"

    - name: Run Pytest Forensic Verification Matrix
      run: |
        pytest -v backend/tests --durations=10

  frontend-audit-and-tests:
    name: Frontend Quality, Audit & Production Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci || npm install

    - name: Frontend Dependency Security Audit
      working-directory: ./frontend
      run: npm audit --audit-level=high

    - name: Run Vitest Unit Tests
      working-directory: ./frontend
      run: npx vitest run

    - name: Typecheck and Build Production Distribution
      working-directory: ./frontend
      run: npm run build

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-audit-and-tests, frontend-audit-and-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build TRACEX Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: tracex-platform:ci-test
